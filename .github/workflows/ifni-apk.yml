name: Ifni 1957 · compilar APK
on:
  push:
    paths:
      - 'ifni-1957/**'
      - '.github/workflows/ifni-apk.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: ifni-1957
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: SDK de Android preinstalado en el runner
        run: echo "sdk.dir=$ANDROID_HOME" && ls "$ANDROID_HOME"
      - run: npm ci
      - run: npm run android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ifni-1957-apk
          path: ifni-1957/android/app/build/outputs/apk/debug/app-debug.apk
      - name: Copiar APK con nombre fijo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ifni-1957.apk
      - name: Publicar descarga directa (se sustituye en cada compilación)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ifni-1957
          name: Ifni 1957 · versión de prueba
          body: APK de prueba de Ifni 1957. Se actualiza solo con cada cambio del juego. Anuncios y compras en modo simulado.
          prerelease: true
          make_latest: false
          files: ifni-1957/ifni-1957.apk
